apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId 'pk.askyservices.sunmiprinter'
        minSdkVersion 21
        targetSdkVersion 25
        versionCode 1
        versionName '1.0.0'
    }
    lintOptions { abortOnError false }
}

dependencies {
    implementation 'com.sunmi:printerlibrary:1.0.18'
}
